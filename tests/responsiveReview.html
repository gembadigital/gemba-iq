<!doctype html><html lang="tr"><meta charset="utf-8"><title>Gemba IQ responsive review</title><style>body{font:13px Inter,Arial;margin:16px}td,th{padding:8px;text-align:left;border-bottom:1px solid #ddd}iframe{border:1px solid #ccc}#status{font-weight:bold}</style><h1>Responsive kontrol · uzun ve dolu örnek kayıtlar</h1><p id="status">Kontrol sürüyor</p><table><thead><tr><th>Ekran / durum</th><th>Sonuç</th><th>Satır / alan</th></tr></thead><tbody id="results"></tbody></table><iframe id="frame" title="Test edilen ekran"></iframe><script>
const baseRoutes=['revenue-management','management-pl','lead-profiles','lead-generator','ai-sales-assistant','companies-registry','company-discovery','services','sales-dashboard','deal-management','proposal-management','create-proposal','todo-list','documents','target-accounts','marketing-ai-coach','marketing-overview','marketing-industry-intel','marketing-target-market','marketing-bd-pipeline','marketing-growth-health','marketing-digital-intel','marketing-kpi-okr','campaign-manager','outreach-approval','contract-manager','dashboard','designer','progress','history'];
const variants=[['proposal-management','edit'],['companies-registry','detail'],['companies-registry','edit'],['todo-list','list'],['todo-list','add'],['revenue-management','data'],['revenue-management','invoices'],['management-pl','table'],['deal-management','list'],['create-proposal','stage2'],['services','definition'],...['contacts','activities','opportunities','proposals','emails','documents','meetings','revenue','research'].map(tab=>['companies-registry',tab]),['sales-dashboard','targets'],...['users','email','templates','datahub','auditlogs','aisettings','systemhealth'].map(tab=>['screen-admin',tab])];
const params=new URLSearchParams(location.search),width=Number(params.get('width')||390),only=params.get('only'),frame=document.getElementById('frame');frame.width=width;frame.height=844;
const cases=[...baseRoutes.map(r=>[r,'']),...variants,['screen-admin',''],['screen-account',''],['screen-auth','']].filter(([r])=>!only||only.split(',').includes(r));
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
function button(d,re){return Array.from(d.querySelectorAll('button')).find(b=>re.test(b.textContent)||re.test(b.getAttribute('title')||''));}
async function click(d,re){const b=button(d,re);if(!b)throw Error('Kontrol bulunamadı: '+re);b.click();await sleep(170);}
async function scenario(d,r,v){
 if(r==='proposal-management'&&v==='edit'){d.querySelector('[data-crm-proposal-card] [aria-haspopup="menu"]').click();await sleep(100);await click(d,/Teklif detaylarını düzenle/);}
 if(r==='companies-registry'&&v){const c=d.querySelector('tbody tr td:nth-child(2) [class*="cursor-pointer"]')||Array.from(d.querySelectorAll('tbody [class*="cursor-pointer"]')).find(e=>e.textContent.includes('Örnek Anadolu'));if(!c)throw Error('Örnek müşteri bulunamadı');c.click();await sleep(200);if(!['edit','detail'].includes(v)){const tab=d.querySelector('[data-crm-company-tab="'+v+'"]');if(!tab)throw Error('Müşteri sekmesi yok: '+v);tab.click();await sleep(180);}if(v==='edit'){const b=d.querySelector('.company-profile-edit');if(!b)throw Error('Müşteri düzenleme düğmesi yok');b.click();await sleep(100);}}
 if(r==='sales-dashboard'&&v==='targets')await click(d,/Hedefleri Düzenle/);
 if(r==='todo-list'&&v==='list')await click(d,/^(Liste|List)$/);
 if(r==='todo-list'&&v==='add')await click(d,/(Yeni Görev Ekle|Yeni Görev|Add New Task)/);
 if(r==='revenue-management'&&v){await click(d,/Operasyonlar ve Veri Girişi/);if(v==='invoices')await click(d,/(Faturalar|Fatura.*Yükleme|Invoices.*Quick)/);}
 if(r==='management-pl'&&v==='table')await click(d,/P\/L Tablosu/);
 if(r==='deal-management'&&v==='list')await click(d,/Tablo Liste Görünümünü Göster/);
 if(r==='create-proposal'&&v==='stage2'){const inputs=d.querySelectorAll('#wizard-step-1-card input');const set=(e,value)=>{Object.getOwnPropertyDescriptor(HTMLInputElement.prototype,'value').set.call(e,value);e.dispatchEvent(new Event('input',{bubbles:true}));};if(inputs[0])set(inputs[0],'Örnek Üretim A.Ş.');if(inputs[1])set(inputs[1],'Örnek');await sleep(100);await click(d,/^İleri/);}
 if(r==='services'&&v==='definition'){const s=d.querySelector('#service-cards-config-tab select');s.value=Array.from(s.options).find(o=>o.text.includes('[201]'))?.value||s.options[1].value;s.dispatchEvent(new Event('change',{bubbles:true}));await sleep(200);}
 const required=r==='sales-dashboard'&&v==='targets'?'input[type="number"]':r==='proposal-management'&&v==='edit'?'.crm-dialog':r==='companies-registry'&&v==='detail'?'.company-detail':r==='companies-registry'&&v==='edit'?'form[data-crm-modal]':r==='todo-list'&&v==='add'?'[data-crm-modal]':r==='create-proposal'&&v==='stage2'?'#wizard-step-2-card':((r==='todo-list'||r==='management-pl'||r==='deal-management')&&v==='list')||r==='management-pl'&&v==='table'?'table':r==='revenue-management'&&v?'table':r==='services'&&v==='definition'?'[data-crm-document]':null;
 if(required&&!d.querySelector(required))throw Error('Beklenen görünüm açılmadı: '+required);
}
function inspect(d){const issues=[],root=d.querySelector('[data-crm-route]')||d.querySelector('[data-crm-screen]'),err=d.querySelector('[role="alert"]');if(!root||err)issues.push(err?.textContent||'Ekran yüklenmedi');if(root&&root.scrollWidth>root.clientWidth+3){issues.push('Sayfa taşması '+root.clientWidth+'/'+root.scrollWidth);const edge=root.getBoundingClientRect().right;issues.push(...Array.from(root.querySelectorAll('*')).filter(e=>e.getBoundingClientRect().right>edge+4&&e.getBoundingClientRect().width>0&&!e.closest('[data-crm-scroll],[data-crm-document]')).slice(0,4).map(e=>e.tagName+' '+e.className));}
 for(const heading of d.querySelectorAll('[data-crm-heading]')){if(heading.closest('[data-crm-document]'))continue;const style=d.defaultView.getComputedStyle(heading);if(style.textTransform==='uppercase'||style.fontFamily.includes('monospace'))issues.push('Eski başlık tipografisi');}
 for(const header of d.querySelectorAll('[data-crm-header]')){const style=d.defaultView.getComputedStyle(header);if(parseFloat(style.borderTopWidth)>0)issues.push('Eski kutulu sayfa başlığı');}
 const cells=Array.from(d.querySelectorAll('tbody td')).filter(c=>!c.closest('[data-crm-document]')&&c.getBoundingClientRect().width>0);for(const c of cells){if(c.colSpan>1)continue;const b=c.getBoundingClientRect();if(c.textContent.trim().length>25&&b.width<82)issues.push('Dar veri hücresi '+Math.round(b.width)+' px: '+c.textContent.trim().slice(0,24));}
 const cards=Array.from(d.querySelectorAll('[data-crm-proposal-card]'));if(width<768&&cards.length){let previousBottom=-Infinity;for(const c of cards){const b=c.getBoundingClientRect();if(b.top<previousBottom-1)issues.push('Teklif kartları üst üste');previousBottom=b.bottom;for(const cell of c.querySelectorAll('[data-crm-cell]')){const rect=cell.getBoundingClientRect();if(rect.bottom>b.bottom+1)issues.push('Teklif içeriği kartın dışına taşıyor');}const subject=c.querySelector('[data-crm-cell="subject"]');if(subject.getBoundingClientRect().width<width-100)issues.push('Teklif başlığı tam genişlikte değil');}}
 for(const e of d.querySelectorAll('[data-crm-modal],.crm-dialog')){const b=e.getBoundingClientRect();if(b.width&&b.right>width+1)issues.push('Pencere ekranın dışına taşıyor');}
 return {issues:[...new Set(issues)],rows:cells.length,fields:d.querySelectorAll('input,select,textarea').length};}
async function run(){let failures=0;for(const [route,variant]of cases){await new Promise(resolve=>{frame.onload=()=>setTimeout(resolve,600);frame.src=(route.startsWith('screen-')?'index.html?screen='+route.slice(7):'index.html?route='+route)+'&dense'+(route==='screen-admin'&&variant?'&panel='+variant:'')+(params.has('dark')?'&dark':'');});const d=frame.contentDocument;let result;try{if(variant)await scenario(d,route,variant);result=inspect(d);}catch(e){result={issues:[e.message],rows:0,fields:0};}const tr=document.createElement('tr');tr.dataset.ok=String(!result.issues.length);tr.dataset.case=route+'/'+variant;tr.innerHTML='<td>'+route+(variant?' / '+variant:'')+'</td><td>'+(result.issues.join('; ')||'GEÇTİ')+'</td><td>'+result.rows+' / '+result.fields+'</td>';document.getElementById('results').append(tr);if(result.issues.length)failures++;}document.getElementById('status').textContent='TAMAMLANDI: '+cases.length+' ekran/durum · '+width+' px · '+failures+' sorun';}run();
</script></html>
