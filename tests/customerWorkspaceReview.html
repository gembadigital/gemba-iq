<!doctype html><html lang="tr"><meta charset="utf-8"><title>Müşteri ekranları kontrolü</title><p id="status">Çalışıyor</p><iframe id="preview" style="height:900px;border:0"></iframe><table><tbody id="results"></tbody></table><script type="module">
const frame=document.querySelector('#preview'),sleep=ms=>new Promise(r=>setTimeout(r,ms));let checks=0,failures=0;
const assert=(v,m)=>{if(!v)throw Error(m);};
async function load(route,width=1280,extra=''){frame.style.width=width+'px';await new Promise(resolve=>{frame.onload=()=>setTimeout(resolve,300);frame.src='index.html?dense&route='+route+extra;});return frame.contentDocument;}
async function test(name,fn){let error='';try{await fn();}catch(e){error=e.message;failures++;}checks++;const tr=document.createElement('tr');tr.dataset.ok=String(!error);tr.textContent=name+': '+(error||'GEÇTİ');document.querySelector('#results').append(tr);document.querySelector('#status').textContent=checks+' kontrol, '+failures+' sorun';}
const add=d=>[...d.querySelectorAll('button')].find(b=>/^(Yeni Şirket Ekle|Add New Company|Yeni Müşteri)/.test(b.textContent.trim()));
async function field(d,key,value){const e=d.querySelector('[data-company-field="'+key+'"]');assert(e,'Alan yok: '+key);e.focus();Object.getOwnPropertyDescriptor(HTMLInputElement.prototype,'value').set.call(e,value);e.dispatchEvent(new Event('input',{bubbles:true}));e.blur();await sleep(70);}
for(const [width,dark] of [[320,false],[390,false],[768,false],[1280,false],[390,true],[1280,true]])await test('Boş kart / '+width+' / '+dark,async()=>{const d=await load('companies-registry',width,dark?'&dark':'');const before=frame.contentWindow.workspaceFixture.companies.length;assert(!d.body.textContent.includes('Tek Güvenilir Kaynak'),'Eski açıklama duruyor');assert(d.querySelector('#sidebar-nav-companies-registry')?.getAttribute('data-submenu')!=='true','Müşteriler alt menü');assert(add(d),'Yeni müşteri düğmesi yok');add(d).click();await sleep(120);assert(d.querySelector('.company-detail'),'Tam müşteri kartı açılmadı');assert(!d.querySelector('[data-crm-modal]'),'Küçük pencere açıldı');assert(d.querySelector('[data-company-field=name]').value==='','İsim boş değil');assert(frame.contentWindow.workspaceFixture.companies.length===before,'Boş kayıt yaratıldı');assert(d.querySelectorAll('[data-crm-company-tab]').length===1,'Kaydedilmemiş karta ilişkili kayıt eklenebilir');const route=d.querySelector('[data-crm-route]');assert(route.scrollWidth<=route.clientWidth+3,'Kart yatay taşıyor');d.querySelector('[data-new-customer-save]').click();await sleep(90);assert(d.querySelector('[role=alert]'),'Boş isim engellenmedi');assert(frame.contentWindow.workspaceFixture.companies.length===before,'İsimsiz kayıt yaratıldı');[...d.querySelectorAll('button')].find(b=>/^(Vazgeç|Cancel)$/.test(b.textContent.trim())).click();await sleep(90);assert(!d.querySelector('.company-detail'),'Vazgeç karta döndürmedi');assert(frame.contentWindow.workspaceFixture.companies.length===before,'Vazgeç kayıt yarattı');});
await test('Kayıt hatası / yeniden deneme / listeye dönüş',async()=>{const d=await load('companies-registry');const f=frame.contentWindow.workspaceFixture,before=f.companies.length;add(d).click();await sleep(100);await field(d,'name','Yeni Müşteri Kontrol');await field(d,'phone','+49 555 1234');f.persistenceError=true;d.querySelector('[data-new-customer-save]').click();await sleep(120);assert(d.querySelector('[role=alert]'),'Sunucu hatası görünmüyor');assert(f.companies.length===before,'Başarısız kayıt listeye eklendi');assert(d.querySelector('[data-company-field=name]').value==='Yeni Müşteri Kontrol','Taslak kayboldu');f.persistenceError=false;d.querySelector('[data-new-customer-save]').click();await sleep(120);assert(f.companies.length===before+1,'Müşteri kaydedilmedi');assert(f.companies.find(c=>c.name==='Yeni Müşteri Kontrol')?.phone==='+49 555 1234','Kart alanları kayboldu');assert(f.confirmedCompanySaves===1,'Onaylı kayıt tamamlanmadı');d.querySelector('.company-detail [data-crm-header-copy] button').click();await sleep(100);assert(!d.querySelector('.company-detail'),'Listeye dönülmedi');assert(d.body.textContent.includes('Yeni Müşteri Kontrol'),'Yeni müşteri listede yok');});
for(const dark of [false,true])await test('E-posta mavi / '+dark,async()=>{const d=await load('lead-profiles',1280,dark?'&dark':'');const el=d.querySelector('[data-crm-email]');assert(el?.textContent.includes('contact@example.test'),'Örnek e-posta görünmüyor');const c=d.defaultView.getComputedStyle(el).color;assert(c===(dark?'rgb(96, 165, 250)':'rgb(0, 120, 212)'),'E-posta rengi yanlış: '+c);});
await test('Almanya şirket arama menüsü ve doğrudan ekran',async()=>{const d=await load('company-discovery',390,'&germany');assert(!d.querySelector('#sidebar-nav-company-discovery'),'Almanya şirket arama menüsü açık');assert(d.querySelector('[data-crm-route]').dataset.crmRoute==='companies-registry','Almanya eski arama rotası açık');add(d).click();await sleep(100);assert(d.querySelector('[data-company-field=billingCountry]')?.value==='Germany','Almanya müşteri ülkesi yanlış');});
await test('Türkiye şirket araması korunur',async()=>{const d=await load('companies-registry');assert(d.querySelector('#sidebar-nav-company-discovery'),'Türkiye araması kaldırıldı');});
await test('Kanban teklifi aynı Teklif Yönetimi kaydına açılır',async()=>{const d=await load('deal-management');const btn=d.querySelector('[data-deal-proposal-link]');assert(btn,'Kanban teklif bağlantısı yok');assert(btn.textContent.includes('2611-70'),'Yanlış teklif numarası');btn.click();await sleep(400);assert(d.querySelector('[data-crm-route]').dataset.crmRoute==='proposal-management','Teklif Yönetimi açılmadı');assert(d.querySelector('iframe[title="PROP-2611-70"]'),'İlgili teklif PDF detayı açılmadı');});
document.querySelector('#status').textContent='TAMAMLANDI: '+checks+' kontrol, '+failures+' sorun';
</script></html>
