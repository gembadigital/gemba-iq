<!doctype html><html><meta charset=utf-8><h1>Takvim responsive kontrolü</h1><pre id=results>Çalışıyor</pre><iframe id=f style=border:0;height:1000px></iframe><script>const results=[];const f=document.getElementById("f");async function run(){for(const dark of [false,true])for(const width of [320,390,768,1280]){f.width=width;await new Promise(resolve=>{f.onload=resolve;f.src="index.html?test"+(dark?"&dark":"");});for(let i=0;i<120;i++){await new Promise(r=>setTimeout(r,100));const out=f.contentDocument.getElementById("calendar-test-results");if(out){results.push({width,dark,result:JSON.parse(out.textContent)});break;}}document.getElementById("results").textContent=JSON.stringify(results,null,2);}document.getElementById("results").dataset.complete="true";}run();</script></html>
