<!doctype html><html lang="tr"><meta charset="utf-8"><title>Kişisel API ekranı kontrolü</title><h1>Kişisel API ekranı · sentetik hesap</h1><p id="status">Kontrol sürüyor</p><div id="results"></div><iframe id="frame" title="API ayarları önizlemesi" height="1400"></iframe><script>
const frame=document.getElementById('frame');async function run(){let count=0,fail=0;for(const width of [320,1280])for(const dark of [false,true]){frame.width=width;await new Promise(resolve=>{frame.onload=resolve;frame.src='index.html?screen=account&connected'+(dark?'&dark':'');});await new Promise(r=>setTimeout(r,400));const d=frame.contentDocument,p=d.querySelector('[data-personal-provider-settings]'),issues=[];if(!p)issues.push('API bölümü yok');else{if(p.querySelectorAll('input[type=password]').length!==2)issues.push('Şifreli iki giriş alanı yok');if([...p.querySelectorAll('input')].some(i=>i.value))issues.push('Anahtarlar boş gelmiyor');if([...p.querySelectorAll('input')].some(i=>i.autocomplete!=='new-password'))issues.push('Otomatik doldurma ayarı hatalı');if(d.documentElement.scrollWidth>d.documentElement.clientWidth+3)issues.push('Sayfa taşıyor');}count++;if(issues.length)fail++;document.getElementById('results').append(Object.assign(document.createElement('p'),{textContent:width+' '+(dark?'koyu':'açık')+' · '+(issues.join('; ')||'GEÇTİ')}));}document.getElementById('status').textContent='TAMAMLANDI: '+count+' kontrol · '+fail+' sorun';}run();</script></html>
