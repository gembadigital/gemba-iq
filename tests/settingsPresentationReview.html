<!doctype html><html lang="tr"><meta charset="utf-8"><title>Ayarlar ve düğme okunabilirliği</title><style>body{font:14px Arial}iframe{border:1px solid #ccc;height:900px}td{padding:6px;border-bottom:1px solid #ccc}</style><h1>Ayarlar ve düğme okunabilirliği · sentetik veriler</h1><p id="status">Kontrol sürüyor</p><table><tbody id="results"></tbody></table><iframe id="frame" title="Test ekranı"></iframe><script>
const frame=document.getElementById('frame'),rows=document.getElementById('results'),cases=['screen=account&connected','screen=admin&superadmin','screen=admin&panel=aisettings','screen=admin&panel=datahub','route=proposal-management&superadmin'];
const extraRoutes=['revenue-management','management-pl','lead-profiles','lead-generator','ai-sales-assistant','companies-registry','company-discovery','services','sales-dashboard','deal-management','proposal-management','create-proposal','todo-list','calendar','documents','target-accounts','marketing-ai-coach','marketing-overview','marketing-industry-intel','marketing-target-market','marketing-bd-pipeline','marketing-growth-health','marketing-digital-intel','marketing-kpi-okr','campaign-manager','outreach-approval','contract-manager','dashboard','designer','progress','history'];
const pause=ms=>new Promise(r=>setTimeout(r,ms));
function inspect(d,route){const failures=[],w=d.defaultView,canvas=d.createElement('canvas'),ctx=canvas.getContext('2d');canvas.width=canvas.height=1;const rgb=c=>{ctx.clearRect(0,0,1,1);ctx.fillStyle=c;ctx.fillRect(0,0,1,1);return [...ctx.getImageData(0,0,1,1).data].map((v,i)=>i===3?v/255:v)};const luminance=a=>a.slice(0,3).map(v=>{v/=255;return v<=.04045?v/12.92:((v+.055)/1.055)**2.4}).reduce((s,v,i)=>s+v*[.2126,.7152,.0722][i],0);const ratio=(a,b)=>{const x=luminance(a),y=luminance(b);return (Math.max(x,y)+.05)/(Math.min(x,y)+.05)};const background=e=>{let out=[0,0,0,0];for(let n=e;n;n=n.parentElement){const c=rgb(w.getComputedStyle(n).backgroundColor),a=out[3]+c[3]*(1-out[3]);if(a)out=[...out.slice(0,3).map((v,i)=>(v*out[3]+c[i]*c[3]*(1-out[3]))/a),a];if(a>.999)break;}return out[3]?[...out.slice(0,3).map(v=>v*out[3]+255*(1-out[3])),1]:[255,255,255,1];};
 for(const b of d.querySelectorAll('button')){if(b.disabled||!b.textContent.trim()||!b.getBoundingClientRect().height||b.closest('[data-crm-document],.a4-page'))continue;const r=ratio(rgb(w.getComputedStyle(b).color),background(b));if(r<1.5)failures.push('Okunmayan düğme: '+b.textContent.trim().slice(0,60)+' ('+r.toFixed(2)+')');}
 if(route==='screen=account&connected'){const b=[...d.querySelectorAll('button')].find(b=>b.textContent.trim()==='Test');if(!b)failures.push('Bağlı hesap Test düğmesi yok');else if(ratio(rgb(w.getComputedStyle(b).color),background(b))<4.5)failures.push('Test yazısı yeterince okunmuyor');}
 if(route==='screen=admin&superadmin'&&!d.querySelector('[data-organization-switcher]'))failures.push('Seçici organizasyon ayarlarında yok');
 if(route.includes('route=')&&d.querySelector('[data-ui-sidebar] [data-organization-switcher]'))failures.push('Seçici halen ana menüde');
 if(route.includes('aisettings')&&d.querySelector('textarea'))failures.push('Bağlı olmayan prompt düzenleyicisi halen var');
 if(route.includes('datahub')&&d.body.textContent.includes('62.8 MB'))failures.push('Sabit kapasite halen var');
 if(d.documentElement.scrollWidth>d.documentElement.clientWidth+3)failures.push('Sayfa taşması');return failures;}
async function run(){let total=0,bad=0;for(const width of [320,1280])for(const dark of [false,true])for(const route of (width===1280?cases.concat(extraRoutes.filter(r=>r!=="proposal-management").map(r=>"route="+r)):cases)){frame.width=width;await new Promise(resolve=>{frame.onload=resolve;frame.src='index.html?'+route+(dark?'&dark':'');});await pause(300);const errors=inspect(frame.contentDocument,route);total++;if(errors.length)bad++;const row=document.createElement('tr');row.dataset.ok=String(!errors.length);row.textContent=width+' '+(dark?'koyu':'açık')+' '+route+' · '+(errors.join('; ')||'GEÇTİ');rows.append(row);}document.getElementById('status').textContent='TAMAMLANDI: '+total+' kontrol · '+bad+' sorun';}
run();</script></html>
